spring.application.name=java-byod-backend

# Server
server.port=8080

# Database (Railway injects these as environment variables at runtime)
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:byod}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# Disable Spring Boot auto schema creation (we manage schema manually)
spring.sql.init.mode=never

# Jackson
spring.jackson.default-property-inclusion=non_null